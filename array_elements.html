<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        <h2>array modify and delete</h2>
        var a = ["Tejas", 22, "Male", "Software Developer", "Mumbai"];

        document.write(a, "<br>");
        a[4] = "pune";
        a[1] = 23;

        document.write(a, "<br>");
        delete a[2];
        delete a[4];
        document.write(a, "<br>");
    </script>
    <br>
    <h2>sorting and reverse</h2>
    <script>
        var b = ["shantanu", "sanika","mansoor","saurabh","swara"];

        document.write(b, "<br>");
        b.sort();
        document.write(b,"<br>");
        b.reverse();
        document.write(b, "<br>");
    </script>
    <br>
    <h2>POP and PUSH</h2>
    <script>
        var c = ["shantanu", "sanika","mansoor","saurabh","swara"];
        document.write(c,"<br>");
        c.pop();
        c.pop();
        c.pop();
        document.write(c,"<br>");
        c.push("chetana");
        c.push("Bhumi");
        document.write(c, "<br>");
    </script>
    <br>
    <h2>shift unshift</h2>
    <script>
        var d = ["shantanu", "sanika","mansoor","saurabh","swara"];
        document.write(d,"<br>");
        d.shift();
        d.shift();
        document.write(d, "<br>");
        d.unshift("viraj");
        document.write(d,"<br>");

    </script>
    <br>
    <h2>Contact and Join</h2>
    <script>
        var a = ["shantanu", "sanika","mansoor","saurabh","swara"];
        var b = ["vivek", "Hardik", "Priya", "Sara"];
        var d = ["vrushika", "Dnyaneshwari", "Varad"];
        var c = a.concat(b,d);
        document.write(c,"<br>");
         
         var x = c.join("/");
         document.write(x, "<br>");
    </script>
</body>
</html>
